name: Hooks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Fork code is untrusted. Never add secrets, write permissions, RPC credentials,
# broadcasting, pull_request_target, or a privileged/self-hosted runner here.
permissions:
  contents: read

concurrency:
  group: hooks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Hook structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out catalogue
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Test catalogue runner
        shell: bash
        run: python -m unittest discover -s tests 2>&1 | tee ci-logs/unit-tests.log
      - name: Check whole catalogue structure
        shell: bash
        run: python scripts/check_hooks.py --structure-only --output evidence 2>&1 | tee ci-logs/structure.log
      - name: Present declared registry inputs
        if: always()
        shell: bash
        run: |
          if [[ -f evidence/PR-REVIEW.md ]]; then
            cat evidence/PR-REVIEW.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload structure evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hook-structure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            ci-logs/
          if-no-files-found: warn
          retention-days: 14

  qualification:
    name: Hook qualification
    needs: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out catalogue
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed Foundry version
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: nightly-5e88010a83d1b87b8f4d13058e42a2949d3e9dc0
          cache: false
      - name: Install pinned Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Install pinned public Solidity dependencies
        run: scripts/install-deps.sh
      - name: Qualify every catalogue hook
        shell: bash
        run: python scripts/check_hooks.py --output evidence 2>&1 | tee ci-logs/qualification.log
      - name: Present registration review report
        if: always()
        shell: bash
        run: |
          if [[ -f evidence/PR-REVIEW.md ]]; then
            cat evidence/PR-REVIEW.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hook-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            ci-logs/
          if-no-files-found: warn
          retention-days: 14
